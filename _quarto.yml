project:
  type: website
  output-dir: _site
  pre-render: build_cards.py
  render:
    - "*.qmd"
    - "!packet.qmd"
  resources:
    - images/
    - js/cards.json

website:
  title: "Evaluating Evidence on Education Technology"
  site-url: https://steffenerickson.github.io/edtech-evidence-lab
  navbar:
    left:
      - href: index.qmd
        text: Join
      - href: studies.qmd
        text: Studies
      - href: evaluate.qmd
        text: Rate
      - href: standards.qmd
        text: Standards
      - href: results.qmd
        text: Results
    right:
      - href: instructor.qmd
        text: Instructor
  page-footer:
    left: "Steffen Erickson, University of Virginia"
    right: "Source: [GitHub](https://github.com/steffenerickson/edtech-evidence-lab)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    include-in-header:
      text: |
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
        <script src="js/config.js"></script>
        <script src="js/app.js"></script>
