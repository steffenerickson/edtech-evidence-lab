reveals:
- study_id: s01
  citation: "OECD. (2015). Students, computers and learning: Making the connection. PISA, OECD Publishing. https://doi.org/10.1787/9789264239555-en"
  url: "https://doi.org/10.1787/9789264239555-en"
  authors: "Prepared by Francesco Avvisati with Judit Pál; edited by Marilyn Achiron (OECD Secretariat)."
  affiliations: "Organisation for Economic Co-operation and Development (OECD), Directorate for Education and Skills; steered by the PISA Governing Board."
  funding: "Funded by OECD member and PISA-participating governments. No external sponsor named."
  relationships: "None with technology vendors. Figure 6.5 (p. 153) is the 'hill shape' figure; OECD permits reuse in teaching materials with attribution."
  disclosure_quote: "\"In non-experimental, cross-sectional data such as those gathered through PISA, even sophisticated statistical techniques cannot isolate the cause-and-effect relationship.\" (p. 146)"
- study_id: s02
  citation: "Weatherholtz, K., Grimaldi, P. J., & Hill, K. M. (2022). Use of MAP Accelerator associated with better-than-projected gains in MAP Growth scores (Technical report). Khan Academy. http://khan.co/MATechReport2022"
  url: "http://khan.co/MATechReport2022"
  authors: "Kodi Weatherholtz, Phillip Grimaldi, Kelli Millwood Hill"
  affiliations: "All three authors: Khan Academy (Efficacy & Research team). MAP Accelerator was developed by Khan Academy in partnership with NWEA, maker of MAP Growth."
  funding: "No funding statement in the report. Overdeck Family Foundation lists Khan Academy as grantee for this study."
  relationships: "Authored by employees of the product's maker. Not peer reviewed ('reviewed externally by experts before their release'). Cited on Khan Academy's district sales page as evidence the platform 'accelerates learning.' A peer-reviewed companion appeared in the EDM 2022 industry track."
  disclosure_quote: "\"All statements and conclusions, unless specifically attributed to another source, are those of the authors and do not necessarily reflect the policies or positions of the other organizations.\" (p. 1)"
- study_id: s03
  citation: "Dynarski, M., Agodini, R., Heaviside, S., Novak, T., Carey, N., Campuzano, L., Means, B., Murphy, R., Penuel, W., Javitz, H., Emery, D., & Sussex, W. (2007). Effectiveness of reading and mathematics software products: Findings from the first student cohort (NCEE 2007-4005). U.S. Department of Education, Institute of Education Sciences."
  url: "https://ies.ed.gov/sites/default/files/migrated/nces_pubs/ncee/pdf/20074005.pdf"
  authors: "Mark Dynarski and colleagues"
  affiliations: "Mathematica Policy Research, Inc. and SRI International, under contract ED-01-CO-0039/0007 to the U.S. Department of Education."
  funding: "U.S. Department of Education, mandated by the No Child Left Behind Act (P.L. 107-110, section 2421)."
  relationships: "Vendors volunteered products, suggested many participating districts, trained teachers, and provided technical support; results reported only for groups of products. Public domain."
  disclosure_quote: "\"ED recognized that selecting ostensibly more effective products could tilt the study toward finding higher levels of effectiveness, but the tilt was viewed as a reasonable tradeoff.\" (p. xv)"
